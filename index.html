<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Titan AI</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Markdown & Code Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- Official Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="notranslate">

  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" id="newChatBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          New Chat
        </button>
      </div>

      <div class="history-container">
        <span class="history-label">Recent Chats</span>
        <div class="history-list" id="historyList"></div>
      </div>

      <div class="sidebar-footer">
        <button class="footer-btn" id="clearAllBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          Clear History
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-nav">
        <div class="nav-left">
          <button class="sidebar-toggle" id="sidebarToggle">☰</button>
          <div class="nav-brand">⚡ Titan AI</div>
        </div>

        <div class="nav-actions">
          <!-- Gemini Live Mode Trigger -->
          <button class="live-pill-btn" id="liveModeBtn" title="Hands-free Gemini Live Mode">
            <span class="live-indicator"></span> Live Mode
          </button>
          
          <!-- Google Auth Section -->
          <div id="authContainer">
            <div id="googleBtnContainer"></div>
            <div class="user-profile" id="userProfile" style="display: none;">
              <img id="userAvatar" src="" alt="Profile" class="user-avatar-img">
              <span id="userName">User</span>
              <button class="logout-btn" id="logoutBtn" title="Sign Out">✕</button>
            </div>
          </div>
        </div>
      </header>

      <!-- Chat Viewport -->
      <div class="chat-viewport" id="chatViewport">
        <div class="welcome-card" id="welcomeCard">
          <div class="sparkle-logo">⚡</div>
          <h2>Welcome to Titan AI</h2>
          <p>Text, Voice, Live Weather, Google Login, and Gemini Live enabled.</p>
        </div>
      </div>

      <!-- Live Mode Audio Visualizer Modal -->
      <div class="live-modal-overlay" id="liveModalOverlay" style="display: none;">
        <div class="live-box">
          <div class="live-wave-animation">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <h3 id="liveStatusText">Listening to you...</h3>
          <p>Speak naturally. Titan responds with voice automatically.</p>
          <button class="end-live-btn" id="closeLiveModeBtn">End Live Session</button>
        </div>
      </div>

      <!-- Bottom Chat Input Area -->
      <footer class="input-container">
        <div class="input-card">
          <div class="attachment-bar" id="attachmentBar" style="display: none;">
            <div class="attachment-pill">
              <span id="fileIcon">📎</span>
              <span id="fileName">file.txt</span>
              <button id="removeFileBtn">✕</button>
            </div>
          </div>

          <div class="input-box">
            <input type="file" id="filePicker" accept="image/*,.txt,.js,.py,.html,.css,.json,.md,.csv,.c,.cpp" hidden>
            <button class="icon-btn" id="attachBtn" title="Upload File">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
            </button>

            <button class="icon-btn mic-btn" id="micBtn" title="Click to speak">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            </button>

            <textarea id="userInput" placeholder="Ask Titan AI or talk..." rows="1"></textarea>

            <button class="send-btn" id="sendBtn" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            </button>
          </div>
        </div>
        <div class="disclaimer">Titan AI • Live Weather, Voice & Google Authentication</div>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
