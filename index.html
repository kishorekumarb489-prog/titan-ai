<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Titan AI</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Markdown & Code Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- Google Identity SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="notranslate">

  <div class="window-frame">
    <!-- Left Icon Rail Navigation -->
    <aside class="icon-rail">
      <div class="rail-top">
        <button class="rail-logo-btn" id="newChatBtn" title="New Chat">
          <div class="mascot-mini-icon">🤖</div>
        </button>
        
        <nav class="rail-nav">
          <button class="rail-icon-btn active" id="homeTabBtn" title="Workspace">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          </button>
          <button class="rail-icon-btn" id="historyToggleBtn" title="Recent Chats">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          </button>
          <button class="rail-icon-btn" id="liveRailBtn" title="Gemini Live Voice">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>
          </button>
        </nav>
      </div>

      <div class="rail-bottom">
        <button class="rail-icon-btn" id="clearAllBtn" title="Clear All History">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        </button>
      </div>
    </aside>

    <!-- Slide-out History Drawer -->
    <div class="history-drawer" id="historyDrawer">
      <div class="drawer-header">
        <h4>Recent Sessions</h4>
        <button id="closeDrawerBtn">✕</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>

    <!-- Main Content Canvas -->
    <main class="main-canvas">
      <!-- Top Navigation Header -->
      <header class="app-header">
        <div class="header-left">
          <div class="model-pill">
            <span class="pill-mascot">🤖</span>
            <span class="model-name">Titan AI 3.5 Pro</span>
            <span class="chevron">▾</span>
          </div>
        </div>

        <h1 class="header-title">Titan AI</h1>

        <div class="header-right">
          <!-- Google Sign-in Container -->
          <div id="googleBtnContainer"></div>
          <div class="user-profile" id="userProfile" style="display: none;">
            <img id="userAvatar" src="" alt="Avatar" class="avatar-img">
            <span id="userName">User</span>
            <button class="logout-btn" id="logoutBtn" title="Logout">✕</button>
          </div>
          <button class="upgrade-btn" id="liveModeBtn">
            <span>Live Voice</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
          </button>
        </div>
      </header>

      <!-- Central Workspace Area -->
      <div class="workspace-area">
        <!-- Chat Viewport (Active when messages exist) -->
        <div class="chat-viewport" id="chatViewport">
          <!-- Welcome Hero Section -->
          <div class="hero-section" id="welcomeCard">
            <h2 class="hero-title">
              HI <span id="heroUserName">User</span>, Ready to<br>
              <strong>Achieve Great Things?</strong>
            </h2>

            <!-- Center Mascot with Speech Bubbles -->
            <div class="mascot-stage">
              <div class="speech-bubble left-bubble">
                <span class="bubble-icon">🤖</span> Hey there! Need a boost?
              </div>
              
              <div class="mascot-graphic">
                <div class="robot-head">
                  <div class="robot-face">
                    <span class="robot-eye"></span>
                    <span class="robot-eye"></span>
                  </div>
                </div>
                <div class="robot-body"></div>
              </div>

              <div class="speech-bubble right-bubble">
                <span class="bubble-icon">🤖</span> Hey there! Ready to assist?
              </div>
            </div>
          </div>
        </div>

        <!-- Floating Prompt Card -->
        <div class="floating-input-wrapper">
          <div class="prompt-card">
            <!-- Promo Header Ribbon -->
            <div class="prompt-ribbon">
              <div class="ribbon-text">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
                <span>Live Weather & Multilingual Fallback Engine Active</span>
              </div>
              <button class="ribbon-btn" id="checkWeatherBtn">Live Weather</button>
            </div>

            <!-- File Attachment Badge -->
            <div class="attachment-bar" id="attachmentBar" style="display: none;">
              <div class="attachment-pill">
                <span id="fileIcon">📎</span>
                <span id="fileName">file.txt</span>
                <button id="removeFileBtn">✕</button>
              </div>
            </div>

            <!-- Text Input Row -->
            <div class="input-main-row">
              <textarea id="userInput" placeholder="Initiate a query or send a command to the AI..." rows="1"></textarea>
            </div>

            <!-- Action Tools & Submit Row -->
            <div class="prompt-actions-row">
              <div class="action-pills-group">
                <input type="file" id="filePicker" accept="image/*,.txt,.js,.py,.html,.css,.json,.md,.csv,.c,.cpp" hidden>
                <button class="tool-pill" id="attachBtn">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                  Attach File
                </button>
                <button class="tool-pill" id="reasoningPill">
                  💡 Reasoning
                </button>
                <button class="tool-pill" id="deepResearchPill">
                  🔍 Deep Research
                </button>
              </div>

              <div class="send-buttons-group">
                <button class="mic-circle-btn" id="micBtn" title="Speak">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>
                </button>
                <button class="send-circle-btn" id="sendBtn" disabled title="Send">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
              </div>
            </div>
          </div>

          <!-- Bottom Category Suggestion Pills -->
          <div class="category-pills-row">
            <button class="cat-pill" data-prompt="Write clean code for ">
              <span>&lt;/&gt;</span> Coding
            </button>
            <button class="cat-pill" data-prompt="Give me a healthy recipe and steps for cooking ">
              <span>☕</span> Cooking
            </button>
            <button class="cat-pill" data-prompt="Explain this health concept simply: ">
              <span>🤍</span> Health
            </button>
            <button class="cat-pill" data-prompt="Plan a 3-day budget trip to ">
              <span>🧳</span> Trips
            </button>
            <button class="cat-pill" data-prompt="Help me troubleshoot and debug this error: ">
              <span>⚙️</span> Troubleshoot
            </button>
          </div>
        </div>
      </div>

      <!-- Gemini Live Modal Visualizer -->
      <div class="live-modal-overlay" id="liveModalOverlay" style="display: none;">
        <div class="live-card">
          <div class="live-pulse-rings">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="mascot-live-icon">🤖</div>
          </div>
          <h3 id="liveStatusText">Listening to you...</h3>
          <p>Speak freely. Titan AI will talk back in real-time.</p>
          <button class="end-live-btn" id="closeLiveModeBtn">End Session</button>
        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
